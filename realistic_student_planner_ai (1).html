<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic Student Planner AI</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f19',
                        cardBg: '#131c2e',
                        cardHover: '#1e293b',
                        accent: '#6366f1',
                        accentHover: '#4f46e5'
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        /* Custom scrollbar for clean dark aesthetic */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0b0f19; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
    </style>
</head>
<body class="bg-darkBg text-slate-100 min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white">

    <div id="app" class="flex h-screen overflow-hidden">

        <aside id="sidebar" class="w-64 bg-cardBg border-r border-slate-800 flex flex-col z-20 transition-all duration-300 -translate-x-full md:translate-x-0 fixed md:static h-full">
            <div class="p-5 flex items-center justify-between border-b border-slate-800">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/20">
                        <i data-lucide="sparkles" class="w-5 h-5 text-white"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-base tracking-tight text-white leading-tight">StudentOS</h1>
                        <span class="text-xs text-indigo-400 font-medium">AI Edition v3.2</span>
                    </div>
                </div>
                <button onclick="toggleMobileSidebar()" class="md:hidden text-slate-400 hover:text-white p-1 rounded-lg">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
                <p class="px-3 pb-2 text-[10px] font-bold uppercase tracking-wider text-slate-500">Navigation</p>
                <button onclick="switchTab('today')" id="nav-today" class="nav-item w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-colors bg-indigo-600/15 text-indigo-400">
                    <i data-lucide="sun" class="w-4 h-4"></i>
                    <span>Today's Schedule</span>
                </button>
                <button onclick="switchTab('calendar')" id="nav-calendar" class="nav-item w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:text-slate-100 hover:bg-cardHover transition-colors">
                    <i data-lucide="calendar" class="w-4 h-4"></i>
                    <span>Calendar</span>
                </button>
                <button onclick="switchTab('tasks')" id="nav-tasks" class="nav-item w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:text-slate-100 hover:bg-cardHover transition-colors">
                    <i data-lucide="check-square" class="w-4 h-4"></i>
                    <span>Tasks & Priority</span>
                    <span id="task-badge" class="ml-auto bg-indigo-500/20 text-indigo-300 text-xs px-2 py-0.5 rounded-full font-semibold">0</span>
                </button>
                <button onclick="switchTab('week')" id="nav-week" class="nav-item w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:text-slate-100 hover:bg-cardHover transition-colors">
                    <i data-lucide="columns" class="w-4 h-4"></i>
                    <span>Week View</span>
                </button>
                <button onclick="switchTab('month')" id="nav-month" class="nav-item w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:text-slate-100 hover:bg-cardHover transition-colors">
                    <i data-lucide="grid" class="w-4 h-4"></i>
                    <span>Month View</span>
                </button>

                <p class="px-3 pt-4 pb-2 text-[10px] font-bold uppercase tracking-wider text-slate-500">AI Assistant</p>
                <button onclick="switchTab('ai')" id="nav-ai" class="nav-item w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:text-slate-100 hover:bg-cardHover transition-colors">
                    <i data-lucide="bot" class="w-4 h-4 text-violet-400"></i>
                    <span>Planner AI</span>
                    <span class="ml-auto bg-violet-500/20 text-violet-300 text-[10px] px-1.5 py-0.5 rounded font-bold">PRO</span>
                </button>

                <p class="px-3 pt-4 pb-2 text-[10px] font-bold uppercase tracking-wider text-slate-500">Preferences</p>
                <button onclick="switchTab('settings')" id="nav-settings" class="nav-item w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:text-slate-100 hover:bg-cardHover transition-colors">
                    <i data-lucide="settings" class="w-4 h-4"></i>
                    <span>Settings & Commute</span>
                </button>
            </nav>

            <div class="p-4 border-t border-slate-800">
                <div class="bg-gradient-to-r from-indigo-900/40 to-violet-900/40 p-3.5 rounded-2xl border border-indigo-500/20">
                    <div class="flex items-center space-x-3 mb-2">
                        <div class="w-8 h-8 rounded-full bg-indigo-500/30 flex items-center justify-center text-indigo-300 font-bold text-xs">
                            AI
                        </div>
                        <div>
                            <p class="text-xs font-semibold text-white">Teen Peer AI Ready</p>
                            <p class="text-[10px] text-slate-400">Context aware & smart</p>
                        </div>
                    </div>
                    <button onclick="exportGitHubRepo()" class="w-full mt-1 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium py-2 px-3 rounded-xl transition shadow-md shadow-indigo-600/30 flex items-center justify-center space-x-2">
                        <i data-lucide="github" class="w-3.5 h-3.5"></i>
                        <span>Download GitHub Repo</span>
                    </button>
                </div>
            </div>
        </aside>

        <main class="flex-1 flex flex-col h-screen overflow-hidden bg-darkBg">
            <!-- Header -->
            <header class="h-16 bg-cardBg border-b border-slate-800 px-6 flex items-center justify-between z-10">
                <div class="flex items-center space-x-4">
                    <button onclick="toggleMobileSidebar()" class="md:hidden text-slate-400 hover:text-white p-1.5 rounded-xl bg-slate-800/50">
                        <i data-lucide="menu" class="w-5 h-5"></i>
                    </button>
                    <div>
                        <h2 id="page-title" class="text-lg font-bold text-white tracking-tight">Today's Schedule</h2>
                        <p id="page-subtitle" class="text-xs text-slate-400">Manage your daily timeline & routine seamlessly.</p>
                    </div>
                </div>

                <div class="flex items-center space-x-3">
                    <button onclick="exportGitHubRepo()" class="hidden sm:flex items-center space-x-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium py-2 px-3.5 rounded-xl border border-slate-700 transition">
                        <i data-lucide="download" class="w-3.5 h-3.5 text-indigo-400"></i>
                        <span>GitHub Export</span>
                    </button>
                    <div class="flex items-center space-x-2 bg-indigo-500/10 border border-indigo-500/20 px-3 py-1.5 rounded-xl">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                        <span class="text-xs font-semibold text-indigo-300">AI Synced</span>
                    </div>
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-violet-600 to-indigo-600 flex items-center justify-center text-white font-bold text-sm shadow-md">
                        US
                    </div>
                </div>
            </header>

            <!-- Content Area for Tabs -->
            <div id="content-viewport" class="flex-1 overflow-y-auto p-6">
                <!-- Tabs will be dynamically rendered or toggled here -->
            </div>
        </main>
    </div>

    <script>
        // --- App State ---
        let state = {
            currentTab: 'today',
            settings: {
                wakeTime: '06:30',
                schoolStart: '08:00',
                schoolEnd: '15:00',
                sleepTime: '22:30',
                morningCommuteHrs: 0,
                morningCommuteMins: 30,
                eveningCommuteHrs: 0,
                eveningCommuteMins: 30
            },
            tasks: [
                { id: 1, title: 'Math Problem Set Ch. 4', priority: 'High', duration: 45, completed: false, category: 'Homework' },
                { id: 2, title: 'AP Physics Lab Report', priority: 'High', duration: 60, completed: false, category: 'Science' },
                { id: 3, title: 'Read English Novel Ch 7-9', priority: 'Medium', duration: 30, completed: true, category: 'Reading' },
                { id: 4, title: 'Tabla Practice', priority: 'Medium', duration: 30, completed: false, category: 'Music' }
            ],
            schedule: [],
            chatMessages: [
                { sender: 'ai', text: "Yo! I'm your Planner AI buddy. Need help scheduling homework, shifting times, or just venting about exams? Hit me up!" }
            ],
            calendarEvents: [
                { id: 1, date: '2026-10-05', title: 'Math Midterm Exam', type: 'Exam' },
                { id: 2, date: '2026-10-08', title: 'Physics Project Due', type: 'Project' },
                { id: 3, date: '2026-10-12', title: 'History Essay Submission', type: 'Homework' }
            ]
        };

        // Load saved state if exists
        try {
            const saved = localStorage.getItem('student_os_state_v3');
            if (saved) {
                const parsed = JSON.parse(saved);
                state = { ...state, ...parsed };
            }
        } catch (e) { console.error('Failed to load local storage', e); }

        function saveState() {
            try {
                localStorage.setItem('student_os_state_v3', JSON.stringify(state));
            } catch (e) { console.error('Failed to save', e); }
        }

        // --- Core Helpers & Schedule Generator ---
        function timeToMins(timeStr) {
            const [h, m] = timeStr.split(':').map(Number);
            return h * 60 + m;
        }

        function minsToTime(mins) {
            const h = Math.floor(mins / 60) % 24;
            const m = mins % 60;
            const ampm = h >= 12 ? 'PM' : 'AM';
            const h12 = h % 12 === 0 ? 12 : h % 12;
            return `${h12}:${m < 10 ? '0' : ''}${m} ${ampm}`;
        }

        function minsTo24Hour(mins) {
            const h = Math.floor(mins / 60) % 24;
            const m = mins % 60;
            return `${h < 10 ? '0' : ''}${h}:${m < 10 ? '0' : ''}${m}`;
        }

        function generateTimeline() {
            const wakeMins = timeToMins(state.settings.wakeTime);
            const schoolStartMins = timeToMins(state.settings.schoolStart);
            const schoolEndMins = timeToMins(state.settings.schoolEnd);
            const sleepMins = timeToMins(state.settings.sleepTime);
            const morningCommute = (state.settings.morningCommuteHrs || 0) * 60 + (state.settings.morningCommuteMins || 0);
            const eveningCommute = (state.settings.eveningCommuteHrs || 0) * 60 + (state.settings.eveningCommuteMins || 0);

            let timeline = [];
            let curr = wakeMins;

            // Wake up & Morning routine
            let morningRoutineEnd = schoolStartMins - morningCommute;
            if (morningRoutineEnd < curr) morningRoutineEnd = curr + 30;

            timeline.push({
                time: `${minsToTime(curr)} - ${minsToTime(morningRoutineEnd)}`,
                title: 'Wake Up & Morning Routine',
                type: 'routine',
                duration: morningRoutineEnd - curr,
                desc: 'Get fresh, breakfast, prep for school'
            });

            curr = morningRoutineEnd;
            if (morningCommute > 0) {
                let commuteEnd = curr + morningCommute;
                timeline.push({
                    time: `${minsToTime(curr)} - ${minsToTime(commuteEnd)}`,
                    title: 'Morning Commute to School',
                    type: 'commute',
                    duration: morningCommute,
                    desc: 'Travel time to campus'
                });
                curr = commuteEnd;
            }

            // School hours
            timeline.push({
                time: `${minsToTime(curr)} - ${minsToTime(schoolEndMins)}`,
                title: 'School Hours & Classes',
                type: 'school',
                duration: schoolEndMins - curr,
                desc: 'Classes, lectures, and academic periods'
            });

            curr = schoolEndMins;
            if (eveningCommute > 0) {
                let commuteEnd = curr + eveningCommute;
                timeline.push({
                    time: `${minsToTime(curr)} - ${minsToTime(commuteEnd)}`,
                    title: 'Evening Commute Home',
                    type: 'commute',
                    duration: eveningCommute,
                    desc: 'Travel back home'
                });
                curr = commuteEnd;
            }

            // Uncompleted pending tasks allocated in free evening blocks
            const pendingTasks = state.tasks.filter(t => !t.completed);
            pendingTasks.forEach(task => {
                let endBlock = curr + task.duration;
                if (endBlock > sleepMins - 60) endBlock = sleepMins - 60; // leave breathing room before sleep
                if (endBlock > curr) {
                    timeline.push({
                        time: `${minsToTime(curr)} - ${minsToTime(endBlock)}`,
                        title: `Study/Task: ${task.title}`,
                        type: 'task',
                        duration: endBlock - curr,
                        desc: `Priority: ${task.priority} | Category: ${task.category || 'General'}`
                    });
                    curr = endBlock;
                }
            });

            // Evening relax & Sleep prep
            if (curr < sleepMins) {
                timeline.push({
                    time: `${minsToTime(curr)} - ${minsToTime(sleepMins)}`,
                    title: 'Relaxation, Dinner & Wind Down',
                    type: 'relax',
                    duration: sleepMins - curr,
                    desc: 'Free time, dinner, offline preparation'
                });
            }

            timeline.push({
                time: `${minsToTime(sleepMins)} Onwards`,
                title: 'Sleep & Rest',
                type: 'sleep',
                duration: 480,
                desc: 'Recharge for tomorrow'
            });

            state.schedule = timeline;
        }

        // --- Navigation Controller ---
        function switchTab(tabId) {
            state.currentTab = tabId;
            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.remove('bg-indigo-600/15', 'text-indigo-400');
                el.classList.add('text-slate-400', 'hover:text-slate-100', 'hover:bg-cardHover');
            });
            const activeBtn = document.getElementById(`nav-${tabId}`);
            if (activeBtn) {
                activeBtn.classList.remove('text-slate-400', 'hover:text-slate-100', 'hover:bg-cardHover');
                activeBtn.classList.add('bg-indigo-600/15', 'text-indigo-400');
            }

            const titles = {
                today: { title: "Today's Schedule", subtitle: "Manage your daily timeline & routine seamlessly." },
                calendar: { title: "Academic Calendar", subtitle: "Track exams, project deadlines, and school events." },
                tasks: { title: "Tasks & Priority Management", subtitle: "Organize your to-dos by priority and duration." },
                week: { title: "Weekly Overview", subtitle: "A bird's eye view of your week ahead." },
                month: { title: "Monthly Planner", subtitle: "Long-term planning and major academic milestones." },
                ai: { title: "Planner AI Companion", subtitle: "Chat naturally, adjust schedule, or add tasks with AI." },
                settings: { title: "Settings & Commute", subtitle: "Customize your schedule timings and commute durations." }
            };

            if (titles[tabId]) {
                document.getElementById('page-title').innerText = titles[tabId].title;
                document.getElementById('page-subtitle').innerText = titles[tabId].subtitle;
            }

            renderContent();
            if (window.innerWidth < 768) {
                document.getElementById('sidebar').classList.add('-translate-x-full');
            }
        }

        function toggleMobileSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('-translate-x-full');
        }

        // --- Render Views ---
        function renderContent() {
            generateTimeline();
            updateTaskBadge();
            const viewport = document.getElementById('content-viewport');
            
            if (state.currentTab === 'today') {
                viewport.innerHTML = renderTodayView();
            } else if (state.currentTab === 'tasks') {
                viewport.innerHTML = renderTasksView();
            } else if (state.currentTab === 'ai') {
                viewport.innerHTML = renderAIView();
                scrollToBottomChat();
            } else if (state.currentTab === 'settings') {
                viewport.innerHTML = renderSettingsView();
            } else if (state.currentTab === 'calendar') {
                viewport.innerHTML = renderCalendarView();
            } else if (state.currentTab === 'week') {
                viewport.innerHTML = renderWeekView();
            } else if (state.currentTab === 'month') {
                viewport.innerHTML = renderMonthView();
            }
            lucide.createIcons();
        }

        function updateTaskBadge() {
            const pendingCount = state.tasks.filter(t => !t.completed).length;
            const badge = document.getElementById('task-badge');
            if (badge) badge.innerText = pendingCount;
        }

        // --- Today View ---
        function renderTodayView() {
            const todayStr = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' });
            return `
                <div class="max-w-4xl mx-auto space-y-6">
                    <div class="bg-gradient-to-r from-indigo-900/50 via-cardBg to-violet-900/40 p-6 rounded-2xl border border-indigo-500/20 flex flex-col md:flex-row items-start md:items-center justify-between gap-4 shadow-xl">
                        <div>
                            <div class="flex items-center space-x-2 text-indigo-400 text-xs font-semibold mb-1">
                                <i data-lucide="calendar-days" class="w-4 h-4"></i>
                                <span>${todayStr}</span>
                            </div>
                            <h3 class="text-xl font-bold text-white">Your Optimized Daily Flow</h3>
                            <p class="text-xs text-slate-400 mt-0.5">Times calculated dynamically based on wake-up, school, and commute settings.</p>
                        </div>
                        <div class="flex items-center space-x-3">
                            <button onclick="switchTab('ai')" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold py-2.5 px-4 rounded-xl transition shadow-md shadow-indigo-600/30 flex items-center space-x-2">
                                <i data-lucide="sparkles" class="w-4 h-4"></i>
                                <span>Ask Planner AI to Edit</span>
                            </button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="bg-cardBg p-4 rounded-2xl border border-slate-800 flex items-center space-x-4">
                            <div class="p-3 rounded-xl bg-emerald-500/10 text-emerald-400">
                                <i data-lucide="sunrise" class="w-6 h-6"></i>
                            </div>
                            <div>
                                <p class="text-xs text-slate-400 font-medium">Wake Up & Commute</p>
                                <p class="text-sm font-bold text-white mt-0.5">${state.settings.wakeTime} + ${state.settings.morningCommuteMins}m</p>
                            </div>
                        </div>
                        <div class="bg-cardBg p-4 rounded-2xl border border-slate-800 flex items-center space-x-4">
                            <div class="p-3 rounded-xl bg-indigo-500/10 text-indigo-400">
                                <i data-lucide="book-open" class="w-6 h-6"></i>
                            </div>
                            <div>
                                <p class="text-xs text-slate-400 font-medium">School Hours</p>
                                <p class="text-sm font-bold text-white mt-0.5">${state.settings.schoolStart} - ${state.settings.schoolEnd}</p>
                            </div>
                        </div>
                        <div class="bg-cardBg p-4 rounded-2xl border border-slate-800 flex items-center space-x-4">
                            <div class="p-3 rounded-xl bg-violet-500/10 text-violet-400">
                                <i data-lucide="check-circle-2" class="w-6 h-6"></i>
                            </div>
                            <div>
                                <p class="text-xs text-slate-400 font-medium">Pending Tasks</p>
                                <p class="text-sm font-bold text-white mt-0.5">${state.tasks.filter(t => !t.completed).length} items remaining</p>
                            </div>
                        </div>
                    </div>

                    <div class="space-y-3">
                        <h4 class="text-sm font-bold text-slate-300 uppercase tracking-wider px-1">Timeline Schedule</h4>
                        <div class="space-y-3">
                            ${state.schedule.map((item, idx) => `
                                <div class="bg-cardBg hover:bg-cardHover transition p-4 rounded-2xl border border-slate-800 flex items-start space-x-4 group">
                                    <div class="p-2.5 rounded-xl ${item.type === 'school' ? 'bg-indigo-600/20 text-indigo-400' : item.type === 'commute' ? 'bg-amber-500/20 text-amber-400' : item.type === 'task' ? 'bg-violet-600/20 text-violet-400' : 'bg-slate-800 text-slate-300'}">
                                        <i data-lucide="${item.type === 'school' ? 'graduation-cap' : item.type === 'commute' ? 'bus' : item.type === 'task' ? 'check-square' : item.type === 'sleep' ? 'moon' : 'clock'}" class="w-5 h-5"></i>
                                    </div>
                                    <div class="flex-1">
                                        <div class="flex items-center justify-between">
                                            <h5 class="font-semibold text-white text-sm">${item.title}</h5>
                                            <span class="text-xs font-mono font-medium text-indigo-400 bg-indigo-500/10 px-2.5 py-1 rounded-lg border border-indigo-500/20">${item.time}</span>
                                        </div>
                                        <p class="text-xs text-slate-400 mt-1">${item.desc}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        // --- Tasks View ---
        function renderTasksView() {
            const pendingTasks = state.tasks.filter(t => !t.completed);
            const completedTasks = state.tasks.filter(t => t.completed);

            return `
                <div class="max-w-4xl mx-auto space-y-6">
                    <div class="bg-cardBg p-6 rounded-2xl border border-slate-800 shadow-xl">
                        <h3 class="text-lg font-bold text-white mb-4">Add New Task or Assignment</h3>
                        <form onsubmit="handleAddTask(event)" class="grid grid-cols-1 sm:grid-cols-4 gap-3">
                            <input type="text" id="task-title" placeholder="What needs to be done? (e.g. Physics Lab)" required class="sm:col-span-2 bg-darkBg border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500">
                            <select id="task-priority" class="bg-darkBg border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
                                <option value="High">High Priority</option>
                                <option value="Medium" selected>Medium Priority</option>
                                <option value="Low">Low Priority</option>
                            </select>
                            <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm py-2.5 px-4 rounded-xl transition shadow-md shadow-indigo-600/30 flex items-center justify-center space-x-2">
                                <i data-lucide="plus" class="w-4 h-4"></i>
                                <span>Add Task</span>
                            </button>
                        </form>
                    </div>

                    <div class="space-y-4">
                        <h4 class="text-sm font-bold text-slate-300 uppercase tracking-wider px-1">Pending Tasks (${pendingCount = pendingTasks.length})</h4>
                        <div class="space-y-3">
                            ${pendingTasks.length === 0 ? `
                                <div class="bg-cardBg p-8 rounded-2xl border border-slate-800 text-center text-slate-400">
                                    <i data-lucide="check-circle" class="w-10 h-10 mx-auto text-emerald-400 mb-2"></i>
                                    <p class="font-medium text-white">All caught up!</p>
                                    <p class="text-xs text-slate-400 mt-1">Add tasks above or let Planner AI assign some for you.</p>
                                </div>
                            ` : pendingTasks.map(t => `
                                <div class="bg-cardBg p-4 rounded-2xl border border-slate-800 flex items-center justify-between gap-4 group">
                                    <div class="flex items-center space-x-3">
                                        <input type="checkbox" onclick="toggleTask(${t.id})" class="w-5 h-5 rounded border-slate-700 bg-darkBg text-indigo-600 focus:ring-indigo-500 cursor-pointer">
                                        <div>
                                            <p class="font-semibold text-white text-sm">${t.title}</p>
                                            <div class="flex items-center space-x-2 mt-1">
                                                <span class="text-[10px] px-2 py-0.5 rounded font-semibold ${t.priority === 'High' ? 'bg-rose-500/20 text-rose-300 border border-rose-500/30' : t.priority === 'Medium' ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30' : 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30'}">${t.priority} Priority</span>
                                                <span class="text-[10px] text-slate-400 flex items-center"><i data-lucide="clock" class="w-3 h-3 mr-1"></i> ${t.duration} mins</span>
                                            </div>

                                    </div>
                                    <button onclick="deleteTask(${t.id})" class="text-slate-500 hover:text-rose-400 p-2 rounded-xl transition">
                                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                                    </button>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    ${completedTasks.length > 0 ? `
                        <div class="space-y-3 pt-4">
                            <h4 class="text-sm font-bold text-slate-400 uppercase tracking-wider px-1">Completed (${completedTasks.length})</h4>
                            <div class="space-y-2 opacity-75">
                                ${completedTasks.map(t => `
                                    <div class="bg-cardBg/50 p-3.5 rounded-2xl border border-slate-800/80 flex items-center justify-between gap-4">
                                        <div class="flex items-center space-x-3">
                                            <input type="checkbox" checked onclick="toggleTask(${t.id})" class="w-5 h-5 rounded border-slate-700 bg-darkBg text-indigo-600 focus:ring-indigo-500 cursor-pointer">
                                            <p class="line-through text-slate-400 text-sm">${t.title}</p>
                                        </div>
                                        <button onclick="deleteTask(${t.id})" class="text-slate-600 hover:text-rose-400 p-1.5 rounded-xl transition">
                                            <i data-lucide="trash-2" class="w-4 h-4"></i>

        function handleAddTask(e) {
            e.preventDefault();
            const title = document.getElementById('task-title').value.trim();
            const priority = document.getElementById('task-priority').value;
            if (!title) return;
            
            state.tasks.push({
                id: Date.now(),
                title,
                priority,
                duration: 45,
                completed: false,
                category: 'Homework'
            });
            saveState();
            renderContent();
        }

        function toggleTask(id) {
            const task = state.tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveState();
                renderContent();
            }
        }

        function deleteTask(id) {
            state.tasks = state.tasks.filter(t => t.id !== id);
            saveState();
            renderContent();
        }

        // --- Planner AI Companion View ---
        function renderAIView() {
            return `
                <div class="max-w-4xl mx-auto h-[calc(100vh-9rem)] flex flex-col bg-cardBg rounded-2xl border border-slate-800 shadow-xl overflow-hidden">
                    <div class="p-4 border-b border-slate-800 flex items-center justify-between bg-darkBg/40">
                        <div class="flex items-center space-x-3">
                            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-violet-600 to-indigo-600 flex items-center justify-center text-white shadow-lg">
                                <i data-lucide="bot" class="w-5 h-5"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-white text-sm">Teen Peer AI Assistant</h3>
                                <p class="text-[10px] text-emerald-400 font-medium flex items-center"><span class="w-1.5 h-1.5 rounded-full bg-emerald-400 mr-1.5"></span> Online & Listening</p>
                            </div>
                        </div>
                        <button onclick="clearChat()" class="text-xs text-slate-400 hover:text-white bg-slate-800 px-3 py-1.5 rounded-xl transition">Clear Chat</button>
                    </div>

                    <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4">
                        ${state.chatMessages.map(m => `
                            <div class="flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}">
                                <div class="max-w-[80%] ${m.sender === 'user' ? 'bg-indigo-600 text-white rounded-2xl rounded-tr-sm' : 'bg-slate-800/90 text-slate-200 rounded-2xl rounded-tl-sm border border-slate-700'} p-3.5 text-sm shadow-md">
                                    <p class="leading-relaxed whitespace-pre-wrap">${m.text}</p>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="p-4 border-t border-slate-800 bg-darkBg/40">
                        <form onsubmit="handleChatSubmit(event)" class="flex items-center space-x-2">
                            <input type="text" id="chat-input" placeholder="Type prompt (e.g., 'wad up', 'add physics homework for 50 mins high priority', 'no delete it')..." class="flex-1 bg-darkBg border border-slate-700 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500">
                            <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white p-3 rounded-xl transition shadow-md shadow-indigo-600/30">
                                <i data-lucide="send" class="w-4 h-4"></i>
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        function scrollToBottomChat() {
            const container = document.getElementById('chat-container');
            if (container) container.scrollTop = container.scrollHeight;
        }

        function clearChat() {
            state.chatMessages = [
                { sender: 'ai', text: "Chat cleared! What's up? Want me to schedule something or just chat?" }
            ];
            saveState();
            renderContent();
        }

        function handleChatSubmit(e) {
            e.preventDefault();
            const inputEl = document.getElementById('chat-input');
            const text = inputEl.value.trim();
            if (!text) return;

            state.chatMessages.push({ sender: 'user', text });
            inputEl.value = '';
            renderContent();
            scrollToBottomChat();

            // Simulate intelligent intent discrimination & teen peer tone
            setTimeout(() => {
                const lower = text.toLowerCase();
                let aiReply = "";

                // Strict intent check for corrections / casual greetings
                if (lower.includes('wad up') || lower.includes('yo') || lower.includes('hey') || lower.includes('sup') || lower.includes('hello')) {
                    aiReply = "Yo! Not much, just chilling ready to help you lock down your schedule. What are we tackling today?";
                } else if (lower.includes('no delete') || lower.includes('never mind') || lower.includes('wait') || lower.includes('cancel')) {
                    aiReply = "Got it, canceled that move! What should we do instead?";
                } else if (lower.includes('add') || lower.includes('homework') || lower.includes('study') || lower.includes('exam') || lower.includes('mins') || lower.includes('hours')) {
                    // Extract task details
                    let duration = 45;
                    const durMatch = text.match(/(\d+)\s*(mins|min|minutes|hr|hours)/i);
                    if (durMatch) {
                        const val = parseInt(durMatch[1]);
                        duration = durMatch[2].startsWith('hr') ? val * 60 : val;
                    }
                    let priority = 'Medium';
                    if (lower.includes('high')) priority = 'High';
                    if (lower.includes('low')) priority = 'Low';

                    // Clean task name
                    let taskName = text.replace(/add/gi, '').replace(/for.*?(mins|min|minutes|hr|hours)/gi, '').replace(/high priority|low priority|medium priority/gi, '').trim();
                    if (!taskName) taskName = "Study Session";

                    state.tasks.push({
                        id: Date.now(),
                        title: taskName,
                        priority,
                        duration,
                        completed: false,
                        category: 'AI Assigned'
                    });
                    saveState();
                    aiReply = `Done! Added "${taskName}" (${duration} mins, ${priority} priority) to your tasks and integrated it into your schedule. You're gonna crush it! 🔥`;
                } else {
                    aiReply = `I hear you! If you want me to add a task or schedule something, just say "add [task name] for [X] mins". Otherwise, we can just vibe or tweak your study slots.`;
                }

                state.chatMessages.push({ sender: 'ai', text: aiReply });
                saveState();
                renderContent();
                scrollToBottomChat();
            }, 600);
        }

        // --- GitHub Export Feature ---
        function exportGitHubRepo() {
            const htmlContent = document.documentElement.outerHTML;
            const readmeContent = `# Realistic Student Planner AI\n\nA fully functional, polished student scheduling and productivity web application built as a single-file HTML designed to be downloaded and uploaded straight to GitHub.\n\n## Features\n- Dark Theme UI & Navigation\n- Advanced Intent-Aware Teen Peer AI ("Planner AI")\n- Inline Editable Time Numbers & Commutes\n- Tasks & Priority Management\n- One-Click GitHub Export`;
            const gitignoreContent = `node_modules/\n.DS_Store\n*.log\n`;

            downloadFile(htmlContent, 'index.html', 'text/html');
            setTimeout(() => downloadFile(readmeContent, 'README.md', 'text/markdown'), 300);
            setTimeout(() => downloadFile(gitignoreContent, '.gitignore', 'text/plain'), 600);

            showModal("GitHub Export Package Ready!", "Successfully downloaded `index.html`, `README.md`, and `.gitignore`. You can now upload these files directly to your GitHub repository!");
        }

        function downloadFile(content, filename, type) {
            const blob = new Blob([content], { type });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function showModal(title, msg) {
            const div = document.createElement('div');
            div.className = 'fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-in fade-in duration-200';
            div.innerHTML = `
                <div class="bg-cardBg max-w-md w-full p-6 rounded-2xl border border-slate-700 shadow-2xl space-y-4">
                    <div class="w-12 h-12 rounded-2xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center mx-auto">
                        <i data-lucide="check-circle" class="w-6 h-6"></i>
                    </div>
                    <div class="text-center space-y-1">
                        <h4 class="font-bold text-white text-base">${title}</h4>
                        <p class="text-xs text-slate-300 leading-relaxed">${msg}</p>
                    </div>
                    <button onclick="this.closest('.fixed').remove()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm py-2.5 rounded-xl transition shadow-md shadow-indigo-600/30">
                        Got It!
                    </button>
                </div>
            `;
            document.body.appendChild(div);
            lucide.createIcons();
        }

            renderContent();
            lucide.createIcons();
