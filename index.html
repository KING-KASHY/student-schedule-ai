<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Schedule AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Student Schedule AI</h1>
        <p>Welcome to your interactive schedule planner!</p>
        
        <div class="schedule-control">
            <input type="text" id="taskInput" placeholder="Enter a class or task...">
            <button id="addBtn">Add Task</button>
        </div>

        <ul id="taskList">
            <!-- Tasks will appear here -->
        </ul>
    </main>
    <script src="app.js"></script>
</body>
</html>
